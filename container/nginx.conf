worker_processes 1;
pid /run/nginx.pid;
events { worker_connections 512; }
http {
  access_log off;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server { listen 13002; location / { proxy_pass http://127.0.0.1:3002; proxy_set_header Host 127.0.0.1:3002; } }
  server { listen 13000; location / { proxy_pass http://127.0.0.1:3000; } }
  server { listen 18080; location / { proxy_pass http://127.0.0.1:8080; } }
  server {
    listen 18081;
    location ~ ^/(api|socket|sitemap.xml|auth/) {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
    }
    location / { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $http_host; }
  }
}
