# Local QBFT consortium. Genesis and node identities are generated by start.py.
data-path="/var/lib/besu"
genesis-file="/config/genesis.json"
network-id=1337
sync-mode="FULL"
data-storage-format="BONSAI"

p2p-port=30303
nat-method="DOCKER"
discovery-enabled=false
bootnodes=[]
static-nodes-file="/config/static-nodes.json"
max-peers=10
sync-min-peers=1
permissions-nodes-config-file-enabled=true
permissions-nodes-config-file="/config/permissions.toml"

# Free gas for local development; wallets still sign transactions with chain ID.
min-gas-price=0
tx-pool="SEQUENCED"
strict-tx-replay-protection-enabled=true

# Validators bind RPC to their container loopback; only the RPC node overrides it.
rpc-http-enabled=true
rpc-http-host="127.0.0.1"
rpc-http-port=8545
rpc-http-api=["ETH", "NET", "WEB3", "QBFT"]
host-allowlist=["localhost", "127.0.0.1"]
rpc-ws-enabled=false
graphql-http-enabled=false
metrics-enabled=false
logging="INFO"
