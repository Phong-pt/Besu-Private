name: besu-local

x-besu: &besu
  image: hyperledger/besu:25.6.0
  user: "${LOCAL_UID:?Run python3 network/start.py first}:${LOCAL_GID:?Run python3 network/start.py first}"
  restart: unless-stopped
  stop_grace_period: 45s
  mem_limit: 1g
  environment:
    JAVA_OPTS: "-Xms128m -Xmx512m -XX:ActiveProcessorCount=2"
    BESU_RPC_HTTP_HOST: "127.0.0.1"
  configs:
    - source: besu-config
      target: /config/besu.toml
    - source: genesis
      target: /config/genesis.json
    - source: static-nodes
      target: /config/static-nodes.json
    - source: permissions
      target: /config/permissions.toml
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  validator-ntq:
    <<: *besu
    command: ["--config-file=/config/besu.toml", "--p2p-host=172.28.44.11"]
    volumes:
      - ./.local/validator-ntq:/var/lib/besu
    networks:
      consortium:
        ipv4_address: 172.28.44.11

  validator-v:
    <<: *besu
    command: ["--config-file=/config/besu.toml", "--p2p-host=172.28.44.12"]
    volumes:
      - ./.local/validator-v:/var/lib/besu
    networks:
      consortium:
        ipv4_address: 172.28.44.12

  validator-university-c:
    <<: *besu
    command: ["--config-file=/config/besu.toml", "--p2p-host=172.28.44.13"]
    volumes:
      - ./.local/validator-university-c:/var/lib/besu
    networks:
      consortium:
        ipv4_address: 172.28.44.13

  validator-cert-1:
    <<: *besu
    command: ["--config-file=/config/besu.toml", "--p2p-host=172.28.44.14"]
    volumes:
      - ./.local/validator-cert-1:/var/lib/besu
    networks:
      consortium:
        ipv4_address: 172.28.44.14

  rpc:
    <<: *besu
    command: ["--config-file=/config/besu.toml", "--p2p-host=172.28.44.15", "--rpc-http-host=0.0.0.0"]
    volumes:
      - ./.local/rpc:/var/lib/besu
    ports:
      - "127.0.0.1:8545:8545"
    networks:
      consortium:
        ipv4_address: 172.28.44.15

configs:
  besu-config:
    file: ./besu.toml
  genesis:
    file: ./.local/generated/genesis.json
  static-nodes:
    file: ./.local/static-nodes.json
  permissions:
    file: ./.local/permissions.toml

networks:
  consortium:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.44.0/24
