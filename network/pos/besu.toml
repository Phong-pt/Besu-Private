# Local PoS execution layer. Genesis, ports and JWT paths come from manage.py.
sync-mode="FULL"
data-storage-format="BONSAI"
discovery-enabled=false
bootnodes=[]
nat-method="NONE"
p2p-interface="127.0.0.1"
p2p-host="127.0.0.1"
max-peers=8
sync-min-peers=1
rpc-http-enabled=true
rpc-http-host="127.0.0.1"
rpc-http-api=["ETH", "NET", "WEB3", "TXPOOL"]
host-allowlist=["localhost", "127.0.0.1"]
engine-host-allowlist=["localhost", "127.0.0.1"]
rpc-ws-enabled=false
metrics-enabled=false
strict-tx-replay-protection-enabled=true
min-gas-price=0
target-gas-limit=30000000
logging="INFO"
